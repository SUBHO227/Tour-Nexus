<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dependency / Impact View - TRAVEL-X</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { bg: '#0b1220', panel: '#111a2e', panel2: '#0f1830', line: '#1f2b45' }
        }
      }
    }
  </script>
  <style>
    body {
      background: #0b1220;
      font-family: Inter, system-ui, sans-serif;
      color: #e2e8f0;
    }

    .card {
      background: #111a2e;
      border: 1px solid #1f2b45;
    }

    .chip {
      border-radius: 9999px;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0b1220;
    }

    ::-webkit-scrollbar-thumb {
      background: #1f2b45;
      border-radius: 3px;
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeSlide 0.4s ease forwards;
    }

    @keyframes pulseRing {
      0% {
        transform: scale(0.85);
        opacity: 0.6;
      }

      100% {
        transform: scale(1.9);
        opacity: 0;
      }
    }

    .pulse-dot {
      position: relative;
    }

    .pulse-dot::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: inherit;
      animation: pulseRing 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    .graph-wrap {
      position: relative;
      width: 100%;
      height: 360px;
      overflow: hidden;
    }

    .graph-node {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-align: center;
      line-height: 1.2;
      border: 2px solid transparent;
    }

    .graph-node:hover {
      transform: scale(1.12);
      z-index: 10;
    }

    .graph-node.active {
      transform: scale(1.15);
      z-index: 10;
    }

    @keyframes progressFill {
      from {
        width: 0%;
      }

      to {
        width: var(--pct);
      }
    }

    .bar-fill {
      animation: progressFill 1.1s ease forwards;
    }

    .ripple {
      position: relative;
      overflow: hidden;
    }

    .ripple::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .ripple:active::after {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const Icon = ({ d, className = 'w-5 h-5', style }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth="2" style={style}>
        <path strokeLinecap="round" strokeLinejoin="round" d={d} />
      </svg>
    );

    const I = {
      home: 'M3 12l9-9 9 9M5 10v10h14V10',
      alert: 'M12 9v4m0 4h.01M10.29 3.86l-8.48 14.7A1 1 0 0 0 2.66 20h18.68a1 1 0 0 0 .85-1.44L13.71 3.86a1 1 0 0 0-1.72 0Z',
      impact: 'M3 3v18h18M7 15l4-6 3 4 5-8',
      map: 'M9 20l-6-3V4l6 3 6-3 6 3v13l-6-3-6 3zM9 7v13M15 4v13',
      users: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
      net: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z',
      report: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM14 2v6h6M9 13h6M9 17h6M9 9h1',
      shield: 'M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z',
      pin: 'M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0zM12 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
      check: 'M20 6L9 17l-5-5',
      chevron: 'M9 18l6-6-6-6',
      bell: 'M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0',
      swap: 'M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4',
    };

    const Sidebar = () => (
      <aside className="w-60 bg-panel border-r border-line flex flex-col py-4 shrink-0 fixed h-full z-10">
        <div className="flex items-center gap-2 px-4 mb-8 mt-2">
          <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
            <Icon d={I.map} className="w-4 h-4 text-white" />
          </div>
          <div>
            <p className="font-bold text-white text-sm leading-none tracking-wide">TRAVEL-X</p>
            <p className="text-[10px] text-slate-500 font-medium">Smart Tourism Platform</p>
          </div>
        </div>
        <div className="mb-4">
          <p className="px-4 text-[11px] tracking-widest text-slate-500 font-semibold mb-2">AUTHORITY DASHBOARD</p>
          {[
            ['home', 'Dashboard'],
            ['users', 'Tourist Overview'],
            ['alert', 'Disruption Alerts'],
            ['impact', 'Dependency / Impact', true],
            ['report', 'Reports & Logs'],
            ['shield', 'System Health'],
          ].map(([icon, label, active], i) => (
            <div key={i}
              className={`flex items-center gap-3 px-4 py-2.5 mx-2 rounded-lg cursor-pointer text-sm font-medium transition-all
                ${active ? 'bg-indigo-600/15 text-indigo-400' : 'text-slate-400 hover:bg-white/5 hover:text-slate-200'}`}>
              <Icon d={I[icon]} className="w-4 h-4" />
              <span>{label}</span>
            </div>
          ))}
        </div>
      </aside>
    );

    const NODES = [
      { id: 'rain', label: 'Heavy\nRainfall', type: 'disruption', color: '#f43f5e', x: 50, y: 8, size: 64 },
      { id: 'road', label: 'Road\nClosure', type: 'disruption', color: '#f59e0b', x: 18, y: 22, size: 52 },
      { id: 'power', label: 'Power\nOutage', type: 'disruption', color: '#ef4444', x: 80, y: 22, size: 48 },
      { id: 'konark', label: 'Konark\nTemple', type: 'attraction', color: '#a855f7', x: 24, y: 50, size: 56 },
      { id: 'beach', label: 'Puri\nBeach', type: 'attraction', color: '#6366f1', x: 48, y: 54, size: 60 },
      { id: 'hotel', label: 'Mayfair\nResort', type: 'facility', color: '#0ea5e9', x: 74, y: 50, size: 52 },
      { id: 'transit', label: 'Marine\nDrive Route', type: 'transit', color: '#f97316', x: 12, y: 76, size: 48 },
      { id: 'itin', label: '236 Affected\nItineries', type: 'itinerary', color: '#22c55e', x: 50, y: 82, size: 58 },
      { id: 'tourist', label: '1,156\nTourists', type: 'tourist', color: '#ec4899', x: 84, y: 78, size: 54 },
    ];

    const EDGES = [
      { from: 'rain', to: 'beach', strength: 3 },
      { from: 'rain', to: 'konark', strength: 2 },
      { from: 'rain', to: 'itin', strength: 3 },
      { from: 'road', to: 'transit', strength: 3 },
      { from: 'road', to: 'konark', strength: 2 },
      { from: 'power', to: 'hotel', strength: 2 },
      { from: 'power', to: 'beach', strength: 1 },
      { from: 'beach', to: 'itin', strength: 2 },
      { from: 'konark', to: 'itin', strength: 2 },
      { from: 'hotel', to: 'tourist', strength: 2 },
      { from: 'itin', to: 'tourist', strength: 3 },
      { from: 'transit', to: 'itin', strength: 2 },
    ];

    const TYPE_LABELS = {
      disruption: 'Disruption Source',
      attraction: 'Tourist Attraction',
      facility: 'Facility',
      transit: 'Transit Route',
      itinerary: 'Itinerary Cluster',
      tourist: 'Affected Tourists',
    };

    const IMPACT_ROWS = [
      { label: 'Tourists Impacted', value: '1,156 / 12,450', pct: 9, color: '#f43f5e' },
      { label: 'Itineraries Disrupted', value: '236 / 1,890', pct: 13, color: '#f59e0b' },
      { label: 'Attractions Affected', value: '5 / 152', pct: 3, color: '#a855f7' },
      { label: 'Revenue at Risk', value: '18.6L / 2.1Cr', pct: 9, color: '#ef4444' },
      { label: 'Transit Routes Impacted', value: '3 / 24', pct: 12, color: '#f97316' },
    ];

    const INTERVENTIONS = [
      { title: 'Suggest Alternative Route', sub: 'Konark Highway to Marine Drive Detour', btn: 'Recommend', color: '#6366f1' },
      { title: 'Reschedule Temple Visit', sub: 'Konark Temple - Move to 15 Dec 2025', btn: 'Reschedule', color: '#a855f7' },
      { title: 'Notify Affected Tourists', sub: '1,156 tourists via SMS / App push', btn: 'Send Alert', color: '#f43f5e' },
      { title: 'Activate Backup Venue', sub: 'Mayfair Resort Generator Mode', btn: 'Activate', color: '#0ea5e9' },
    ];

    const NetworkGraph = ({ activeNode, setActiveNode }) => {
      const wrapRef = useRef(null);
      const [dims, setDims] = useState({ w: 800, h: 360 });

      useEffect(() => {
        const obs = new ResizeObserver(([e]) =>
          setDims({ w: e.contentRect.width, h: e.contentRect.height })
        );
        if (wrapRef.current) obs.observe(wrapRef.current);
        return () => obs.disconnect();
      }, []);

      const px = (node) => ({
        cx: (node.x / 100) * dims.w,
        cy: (node.y / 100) * dims.h,
      });

      const strengthWidth = { 1: 1, 2: 1.5, 3: 2.5 };
      const strengthOpacity = { 1: 0.3, 2: 0.55, 3: 0.85 };
      const strengthDash = { 1: '4,4', 2: '0', 3: '0' };

      return (
        <div ref={wrapRef} className="graph-wrap relative" style={{ minHeight: 360 }}>
          <svg className="absolute inset-0 w-full h-full pointer-events-none" style={{ zIndex: 0 }}>
            <defs>
              <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                <path d="M0,0 L0,6 L6,3 z" fill="#4f6380" />
              </marker>
            </defs>
            {EDGES.map((e, i) => {
              const A = NODES.find(n => n.id === e.from);
              const B = NODES.find(n => n.id === e.to);
              if (!A || !B) return null;
              const a = px(A), b = px(B);
              const isActive = activeNode && (e.from === activeNode || e.to === activeNode);
              return (
                <line key={i}
                  x1={a.cx} y1={a.cy} x2={b.cx} y2={b.cy}
                  stroke={isActive ? '#6366f1' : '#3a4f6a'}
                  strokeWidth={isActive ? strengthWidth[e.strength] + 1.5 : strengthWidth[e.strength]}
                  strokeOpacity={isActive ? 1 : strengthOpacity[e.strength]}
                  strokeDasharray={strengthDash[e.strength]}
                  markerEnd="url(#arr)"
                />
              );
            })}
          </svg>

          {NODES.map(node => {
            const { cx, cy } = px(node);
            const isActive = activeNode === node.id;
            return (
              <div key={node.id}
                className={`graph-node ${isActive ? 'active' : ''}`}
                onClick={() => setActiveNode(isActive ? null : node.id)}
                style={{
                  width: node.size, height: node.size,
                  left: cx - node.size / 2, top: cy - node.size / 2,
                  background: node.color + (isActive ? 'ee' : '22'),
                  border: `2px solid ${node.color}${isActive ? 'ff' : '55'}`,
                  color: isActive ? '#fff' : node.color,
                  boxShadow: isActive ? `0 0 18px ${node.color}55` : 'none',
                  zIndex: isActive ? 10 : 1,
                  padding: 4,
                  whiteSpace: 'pre-line',
                }}
              >
                {node.label}
              </div>
            );
          })}
        </div>
      );
    };

    const LegendDot = ({ color, label }) => (
      <div className="flex items-center gap-1.5 text-[11px] text-slate-400">
        <div className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: color }} />
        {label}
      </div>
    );

    const NodeDetail = ({ nodeId }) => {
      if (!nodeId) return (
        <div className="card rounded-2xl p-5 flex flex-col items-center justify-center text-center h-full min-h-44">
          <Icon d={I.net} className="w-10 h-10 text-slate-600 mb-3" />
          <p className="text-slate-300 font-medium text-sm">Click any node</p>
          <p className="text-slate-500 text-xs mt-1">to explore its dependencies and impact chain</p>
        </div>
      );

      const node = NODES.find(n => n.id === nodeId);
      const connectedEdges = EDGES.filter(e => e.from === nodeId || e.to === nodeId);
      const connectedNodes = connectedEdges.map(e =>
        NODES.find(n => n.id === (e.from === nodeId ? e.to : e.from))
      ).filter(Boolean);

      return (
        <div className="card rounded-2xl p-5 h-full fade-in" style={{ borderColor: node.color + '40' }}>
          <div className="flex items-start gap-3 mb-5">
            <div className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0"
              style={{ background: node.color + '20', border: `1px solid ${node.color}40` }}>
              <div className="w-5 h-5 rounded-full" style={{ background: node.color }} />
            </div>
            <div>
              <p className="text-white font-bold text-base leading-tight">{node.label.replace('\n', ' ')}</p>
              <span className="chip text-[10px] px-2 py-0.5 font-semibold mt-1 inline-block"
                style={{ background: node.color + '20', color: node.color }}>
                {TYPE_LABELS[node.type]}
              </span>
            </div>
          </div>
          <p className="text-xs text-slate-400 font-semibold mb-2 uppercase tracking-wider">Connected Nodes ({connectedNodes.length})</p>
          <div className="space-y-2">
            {connectedNodes.map((cn, i) => {
              const edge = connectedEdges.find(e => e.from === cn.id || e.to === cn.id);
              const dir = edge?.from === nodeId ? 'Affects' : 'Affected by';
              return (
                <div key={i} className="flex items-center justify-between p-2 rounded-lg"
                  style={{ background: cn.color + '0d', border: `1px solid ${cn.color}20` }}>
                  <div className="flex items-center gap-2">
                    <div className="w-2 h-2 rounded-full" style={{ background: cn.color }} />
                    <span className="text-sm text-slate-200">{cn.label.replace('\n', ' ')}</span>
                  </div>
                  <span className="text-[10px] font-medium" style={{ color: cn.color }}>{dir}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    const DependencyImpactView = () => {
      const [activeNode, setActiveNode] = useState(null);
      const [tab, setTab] = useState('graph');

      return (
        <div className="flex min-h-screen">
          <Sidebar />

          <main className="flex-1 ml-60 p-6 min-h-screen">

            <div className="flex items-center justify-between mb-6 fade-in">
              <div>
                <h1 className="text-2xl font-bold text-white flex items-center gap-2">
                  <span className="w-8 h-8 rounded-lg bg-indigo-500/20 flex items-center justify-center">
                    <Icon d={I.net} className="w-5 h-5 text-indigo-400" />
                  </span>
                  Dependency / Impact View
                </h1>
                <p className="text-slate-400 text-sm mt-1">
                  Visualise how disruptions cascade through attractions, facilities, routes and tourist itineraries.
                </p>
              </div>
              <div className="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-rose-500/30 bg-rose-500/10 text-rose-400 text-xs font-semibold">
                <span className="w-2 h-2 rounded-full bg-rose-500 pulse-dot" /> 2 Active Disruptions
              </div>
            </div>

            {/* Stat Row */}
            <div className="grid grid-cols-5 gap-3 mb-6 fade-in" style={{ animationDelay: '0.05s' }}>
              {[
                { label: 'Total Tourists', value: '12,450', color: '#a855f7', icon: 'users' },
                { label: 'Tourists Impacted', value: '1,156', color: '#f43f5e', icon: 'alert' },
                { label: 'Itineraries Disrupted', value: '236', color: '#f59e0b', icon: 'report' },
                { label: 'Attractions Affected', value: '5', color: '#6366f1', icon: 'pin' },
                { label: 'Risk Level', value: 'Moderate', color: '#f59e0b', icon: 'shield' },
              ].map(({ label, value, color, icon }, i) => (
                <div key={i} className="card rounded-xl p-3 flex items-center gap-3">
                  <div className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0"
                    style={{ background: color + '18' }}>
                    <Icon d={I[icon]} className="w-4 h-4" style={{ color }} />
                  </div>
                  <div>
                    <p className="text-[10px] text-slate-500 font-medium">{label}</p>
                    <p className="text-sm font-bold text-white">{value}</p>
                  </div>
                </div>
              ))}
            </div>

            {/* Tabs */}
            <div className="flex gap-1 mb-5 bg-panel rounded-xl p-1 w-fit fade-in border border-line" style={{ animationDelay: '0.1s' }}>
              {[
                ['graph', 'net', 'Dependency Graph'],
                ['table', 'impact', 'Impact Analysis'],
                ['interventions', 'swap', 'Interventions'],
              ].map(([key, icon, lbl]) => (
                <button key={key} onClick={() => setTab(key)}
                  className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all
                    ${tab === key ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/20' : 'text-slate-400 hover:text-white'}`}>
                  <Icon d={I[icon]} className="w-4 h-4" /> {lbl}
                </button>
              ))}
            </div>

            {/* ── Dependency Graph Tab ── */}
            {tab === 'graph' && (
              <div className="grid grid-cols-12 gap-5 fade-in">
                <div className="col-span-8 card rounded-2xl overflow-hidden">
                  <div className="flex items-center justify-between px-5 pt-4 pb-3 border-b border-line">
                    <p className="text-white font-semibold text-sm">Live Dependency Network</p>
                    <div className="flex gap-3 flex-wrap">
                      <LegendDot color="#f43f5e" label="Disruption" />
                      <LegendDot color="#a855f7" label="Attraction" />
                      <LegendDot color="#0ea5e9" label="Facility" />
                      <LegendDot color="#f97316" label="Transit" />
                      <LegendDot color="#22c55e" label="Itinerary" />
                      <LegendDot color="#ec4899" label="Tourists" />
                    </div>
                  </div>
                  <div className="p-4 bg-panel2" style={{ minHeight: 360 }}>
                    <NetworkGraph activeNode={activeNode} setActiveNode={setActiveNode} />
                  </div>
                  <div className="px-5 py-3 border-t border-line flex items-center gap-3 text-[11px] text-slate-500">
                    <span>Edge thickness = impact strength</span>
                    <span className="mx-1">·</span>
                    <span className="text-indigo-400">Highlighted path = active disruption cascade</span>
                  </div>
                </div>

                <div className="col-span-4 flex flex-col gap-4">
                  <NodeDetail nodeId={activeNode} />
                  <div className="card rounded-xl p-4">
                    <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Edge Strength</p>
                    <div className="space-y-2.5">
                      {[
                        { style: 'dashed', label: 'Low Dependency', color: '#64748b' },
                        { style: 'normal', label: 'Medium Dependency', color: '#6366f1' },
                        { style: 'bold', label: 'High Dependency', color: '#f43f5e' },
                      ].map(({ style, label, color }, i) => (
                        <div key={i} className="flex items-center gap-3">
                          <div className="w-8 h-0.5 shrink-0"
                            style={{
                              background: style === 'dashed' ? 'none' : color,
                              borderTop: style === 'dashed' ? `2px dashed ${color}` : 'none',
                              height: style === 'bold' ? 3 : 2,
                            }} />
                          <span className="text-xs text-slate-400">{label}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ── Impact Analysis Tab ── */}
            {tab === 'table' && (
              <div className="grid grid-cols-12 gap-5 fade-in">

                <div className="col-span-5 card rounded-2xl p-5">
                  <p className="text-white font-semibold text-sm mb-5">Impact Breakdown</p>
                  <div className="space-y-5">
                    {IMPACT_ROWS.map(({ label, value, pct, color }, i) => (
                      <div key={i}>
                        <div className="flex justify-between text-xs mb-1.5">
                          <span className="text-slate-300 font-medium">{label}</span>
                          <span className="font-bold" style={{ color }}>{value}</span>
                        </div>
                        <div className="h-2 rounded-full overflow-hidden" style={{ background: '#0f1830' }}>
                          <div className="h-full rounded-full bar-fill"
                            style={{ '--pct': pct + '%', width: pct + '%', background: color }} />
                        </div>
                        <p className="text-[10px] text-slate-600 text-right mt-0.5">{pct}% of total</p>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="col-span-7 card rounded-2xl p-5">
                  <p className="text-white font-semibold text-sm mb-4">Affected Tourist Itineraries</p>
                  <table className="w-full text-xs">
                    <thead>
                      <tr className="text-slate-500 text-left border-b border-line">
                        <th className="pb-2 pr-3">Tourist ID</th>
                        <th className="pb-2 pr-3">Location</th>
                        <th className="pb-2 pr-3">Disruption</th>
                        <th className="pb-2 pr-3">Activities</th>
                        <th className="pb-2">Risk</th>
                      </tr>
                    </thead>
                    <tbody>
                      {[
                        ['TRV1001', 'Puri Beach', 'Heavy Rainfall', '2', '#f43f5e', 'High'],
                        ['TRV1002', 'Konark Temple', 'Road Closure', '1', '#f59e0b', 'Moderate'],
                        ['TRV1003', 'Bhubaneswar', 'Power Outage', '1', '#f59e0b', 'Moderate'],
                        ['TRV1004', 'Marine Drive', 'Road Closure', '2', '#f43f5e', 'High'],
                        ['TRV1005', 'Mayfair Resort', 'Power Outage', '0', '#22c55e', 'Low'],
                        ['TRV1006', 'Puri Beach', 'Heavy Rainfall', '3', '#f43f5e', 'High'],
                      ].map(([id, loc, dis, acts, c, risk], i) => (
                        <tr key={i} className="border-t border-line hover:bg-white/[0.02] transition-colors">
                          <td className="py-2.5 pr-3 font-medium text-indigo-400">{id}</td>
                          <td className="py-2.5 pr-3 text-slate-300">{loc}</td>
                          <td className="py-2.5 pr-3 text-slate-400">{dis}</td>
                          <td className="py-2.5 pr-3 text-center">
                            <span className="px-2 py-0.5 rounded-full text-[10px] font-bold"
                              style={{ background: c + '20', color: c }}>{acts}</span>
                          </td>
                          <td className="py-2.5">
                            <span className="font-semibold text-[11px]" style={{ color: c }}>{risk}</span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <div className="mt-4 pt-3 border-t border-line flex justify-between items-center text-xs text-slate-500">
                    <span>Showing 6 of 1,156 affected tourists</span>
                    <button className="text-indigo-400 hover:text-indigo-300 flex items-center gap-1">
                      View All <Icon d={I.chevron} className="w-3.5 h-3.5" />
                    </button>
                  </div>
                </div>

                {/* Cascade chain */}
                <div className="col-span-12 card rounded-2xl p-5">
                  <p className="text-white font-semibold text-sm mb-4">Disruption Cascade Chain</p>
                  <div className="flex items-center gap-2 overflow-x-auto pb-2">
                    {[
                      { label: 'Heavy Rainfall', sub: 'Trigger Event', color: '#f43f5e', arrow: false },
                      { label: '>', sub: '', color: '#4f6380', arrow: true },
                      { label: 'Beach Access Closed', sub: 'Attraction Hit', color: '#6366f1', arrow: false },
                      { label: '>', sub: '', color: '#4f6380', arrow: true },
                      { label: '2 Activities Cancelled', sub: 'Itinerary Hit', color: '#f59e0b', arrow: false },
                      { label: '>', sub: '', color: '#4f6380', arrow: true },
                      { label: '456 Tourists Affected', sub: 'Tourist Impact', color: '#ec4899', arrow: false },
                      { label: '>', sub: '', color: '#4f6380', arrow: true },
                      { label: 'Revenue Loss 4.2L', sub: 'Economic Impact', color: '#ef4444', arrow: false },
                    ].map(({ label, color, sub, arrow }, i) => (
                      arrow ? (
                        <div key={i} className="flex items-center shrink-0 text-slate-600 text-lg font-bold px-1">›</div>
                      ) : (
                        <div key={i} className="shrink-0 p-3 rounded-xl min-w-[120px] text-center"
                          style={{ background: color + '12', border: `1px solid ${color}30` }}>
                          <p className="text-[11px] font-bold leading-snug" style={{ color }}>{label}</p>
                          <p className="text-[10px] text-slate-500 mt-1">{sub}</p>
                        </div>
                      )
                    ))}
                  </div>
                </div>

              </div>
            )}

            {/* ── Interventions Tab ── */}
            {tab === 'interventions' && (
              <div className="grid grid-cols-12 gap-5 fade-in">

                <div className="col-span-8 space-y-4">
                  <p className="text-sm font-semibold text-white">Recommended Interventions</p>
                  {INTERVENTIONS.map(({ title, sub, btn, color }, i) => (
                    <div key={i} className="card rounded-xl p-5 flex items-center justify-between gap-4 ripple hover:border-slate-600 transition-all cursor-pointer">
                      <div className="flex items-start gap-4">
                        <div className="w-10 h-10 rounded-xl flex items-center justify-center shrink-0"
                          style={{ background: color + '18' }}>
                          <Icon d={I.swap} className="w-5 h-5" style={{ color }} />
                        </div>
                        <div>
                          <p className="text-white font-semibold text-sm mb-0.5">{title}</p>
                          <p className="text-xs text-slate-400">{sub}</p>
                        </div>
                      </div>
                      <button className="shrink-0 px-4 py-2 rounded-lg text-sm font-semibold text-white transition-all hover:-translate-y-0.5"
                        style={{
                          background: `linear-gradient(135deg, ${color}, ${color}aa)`,
                          boxShadow: `0 4px 14px ${color}30`
                        }}>
                        {btn}
                      </button>
                    </div>
                  ))}
                </div>

                <div className="col-span-4 space-y-4">
                  <div className="card rounded-2xl p-5">
                    <p className="text-white font-semibold text-sm mb-4 flex items-center gap-2">
                      <Icon d={I.shield} className="w-4 h-4 text-amber-400" /> Overall Risk Score
                    </p>
                    <div className="relative w-32 h-32 mx-auto mb-4">
                      <svg viewBox="0 0 120 120" className="w-full h-full -rotate-90">
                        <circle cx="60" cy="60" r="50" stroke="#1f2b45" strokeWidth="10" fill="none" />
                        <circle cx="60" cy="60" r="50" stroke="#f59e0b" strokeWidth="10" fill="none"
                          strokeDasharray={`${0.62 * 314} 314`} strokeLinecap="round" />
                      </svg>
                      <div className="absolute inset-0 flex flex-col items-center justify-center">
                        <p className="text-2xl font-black text-amber-400">62</p>
                        <p className="text-[10px] text-slate-500 font-medium">/ 100</p>
                      </div>
                    </div>
                    <div className="text-center mb-4">
                      <span className="chip text-xs px-3 py-1 font-bold" style={{ background: '#f59e0b20', color: '#f59e0b' }}>
                        Moderate Risk
                      </span>
                    </div>
                    <div className="space-y-2 text-xs">
                      {[
                        ['Weather Severity', 78, '#f43f5e'],
                        ['Infrastructure Risk', 45, '#f59e0b'],
                        ['Tourist Exposure', 62, '#a855f7'],
                        ['Recovery Capability', 82, '#22c55e'],
                      ].map(([label, pct, color], i) => (
                        <div key={i}>
                          <div className="flex justify-between text-[11px] mb-1">
                            <span className="text-slate-400">{label}</span>
                            <span className="font-semibold" style={{ color }}>{pct}</span>
                          </div>
                          <div className="h-1.5 rounded-full overflow-hidden" style={{ background: '#0f1830' }}>
                            <div className="h-full rounded-full" style={{ width: pct + '%', background: color }} />
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="card rounded-2xl p-4">
                    <p className="text-white font-semibold text-sm mb-3 flex items-center gap-2">
                      <Icon d={I.bell} className="w-4 h-4 text-indigo-400" /> Notification Status
                    </p>
                    <div className="space-y-2.5">
                      {[
                        { label: 'SMS Alerts Sent', value: '1,156', color: '#22c55e' },
                        { label: 'App Notifications', value: '890', color: '#6366f1' },
                        { label: 'Email Updates', value: '420', color: '#0ea5e9' },
                        { label: 'Pending Acks', value: '266', color: '#f59e0b' },
                      ].map(({ label, value, color }, i) => (
                        <div key={i} className="flex justify-between items-center">
                          <span className="text-xs text-slate-400">{label}</span>
                          <span className="text-xs font-bold" style={{ color }}>{value}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

              </div>
            )}

          </main>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<DependencyImpactView />);
  </script>
</body>

</html>
