<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disruption Alert - TRAVEL-X</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { bg: '#0b1220', panel: '#111a2e', panel2: '#0f1830', line: '#1f2b45' }
        }
      }
    }
  </script>
  <style>
    body {
      background: #0b1220;
      font-family: Inter, system-ui, sans-serif;
      color: #e2e8f0;
    }

    .card {
      background: #111a2e;
      border: 1px solid #1f2b45;
    }

    .chip {
      border-radius: 9999px;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0b1220;
    }

    ::-webkit-scrollbar-thumb {
      background: #1f2b45;
      border-radius: 3px;
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.8);
        opacity: 0.5;
      }

      100% {
        transform: scale(2);
        opacity: 0;
      }
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeSlide 0.4s ease forwards;
    }

    .pulse-dot {
      position: relative;
    }

    .pulse-dot::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: inherit;
      animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    .map-pattern {
      background-image: radial-gradient(#1f2b45 1px, transparent 1px);
      background-size: 20px 20px;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Icon = ({ d, className = "w-5 h-5", style }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={style}>
        <path strokeLinecap="round" strokeLinejoin="round" d={d} />
      </svg>
    );

    const I = {
      home: "M3 12l9-9 9 9M5 10v10h14V10",
      alert: "M12 9v4m0 4h.01M10.29 3.86l-8.48 14.7A1 1 0 0 0 2.66 20h18.68a1 1 0 0 0 .85-1.44L13.71 3.86a1 1 0 0 0-1.72 0Z",
      impact: "M3 3v18h18M7 15l4-6 3 4 5-8",
      map: "M9 20l-6-3V4l6 3 6-3 6 3v13l-6-3-6 3zM9 7v13M15 4v13",
      users: "M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75",
      net: "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z",
      report: "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM14 2v6h6M9 13h6M9 17h6M9 9h1",
      bell: "M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0",
      check: "M20 6L9 17l-5-5",
      clock: "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 6v6l4 2",
      pin: "M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0zM12 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4z",
      swap: "M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4",
      info: "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 16v-4M12 8h.01",
      shield: "M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z",
      chevron: "M9 18l6-6-6-6"
    };

    const Sidebar = () => (
      <aside className="w-60 bg-panel border-r border-line flex flex-col py-4 shrink-0 fixed h-full z-10">
        <div className="flex items-center gap-2 px-4 mb-8 mt-2">
          <div className="w-8 h-8 rounded-lg bg-rose-500 flex items-center justify-center shadow-lg shadow-rose-500/20">
            <Icon d={I.alert} className="w-4 h-4 text-white" />
          </div>
          <div>
            <p className="font-bold text-white text-sm leading-none tracking-wide">TRAVEL-X</p>
            <p className="text-[10px] text-slate-500 font-medium">Alert Center</p>
          </div>
        </div>

        <div className="mb-4">
          <p className="px-4 text-[11px] tracking-widest text-slate-500 font-semibold mb-2">TOURIST APP</p>
          {[
            ['home', 'Dashboard'],
            ['users', 'Tourist Profile'],
            ['report', 'Itinerary Generation'],
            ['report', 'Current Itinerary'],
            ['alert', 'Disruption Alert', true],
          ].map(([icon, label, active], i) => (
            <div key={i} className={`flex items-center gap-3 px-4 py-2.5 mx-2 rounded-lg cursor-pointer text-sm font-medium transition-all ${active ? 'bg-rose-500/10 text-rose-400' : 'text-slate-400 hover:bg-white/5 hover:text-slate-200'}`}>
              <Icon d={I[icon]} className="w-4 h-4" />
              <span>{label}</span>
            </div>
          ))}
        </div>
      </aside>
    );

    /* ── ALERT DATA ────────────────────────────────────────────── */
    const DISRUPTIONS = [
      {
        id: 'ALT-9921',
        severity: 'high',
        type: 'Weather Extreme',
        title: 'Heavy Rainfall Warning',
        loc: 'Puri Coastal Belt',
        date: '13 Dec 2025, 06:00 AM – 02:00 PM',
        desc: 'IMD has issued an orange alert for heavy downpour. High tide expected. Beach access restricted.',
        impact: 'Affects 2 activities in your current itinerary today.',
        affectedActivities: [
          { time: '09:00 AM', name: 'Konark Sun Temple Visit', origCost: '₹40' },
          { time: '11:30 AM', name: 'Chandrabhaga Beach', origCost: 'Free' }
        ],
        recommendation: {
          title: 'Reschedule Indoor',
          desc: 'Swap morning beach/temple visits with indoor activities like Odisha State Museum or wait until late afternoon.',
          actionLabel: 'Adopt Alternative Itinerary'
        }
      },
      {
        id: 'ALT-9924',
        severity: 'medium',
        type: 'Traffic & Transit',
        title: 'Highway Maintenance Work',
        loc: 'Konark-Puri Marine Drive',
        date: '13 Dec 2025, 10:00 AM – 05:00 PM',
        desc: 'Single lane operation due to emergency road repairs. Expect delays of 30-45 minutes.',
        impact: 'May delay your transit to Panthanivas Konark for lunch.',
        affectedActivities: [
          { time: '01:30 PM', name: 'Transit to Panthanivas Konark', origCost: '—' }
        ],
        recommendation: {
          title: 'Leave Early / Detour',
          desc: 'Depart 45 minutes earlier than planned, or take the alternate village route via Nimapada.',
          actionLabel: 'Update Route Map'
        }
      }
    ];

    const SEVERITY_CFG = {
      high: { color: '#f43f5e', icon: 'alert', label: 'High Impact' },
      medium: { color: '#f59e0b', icon: 'info', label: 'Medium Impact' },
      low: { color: '#6366f1', icon: 'check', label: 'Low Impact' }
    };

    const DisruptionAlert = () => {
      const [selectedAlert, setSelectedAlert] = useState(DISRUPTIONS[0].id);

      const activeData = DISRUPTIONS.find(d => d.id === selectedAlert);
      const sCfg = SEVERITY_CFG[activeData.severity];

      return (
        <div className="flex min-h-screen">
          <Sidebar />

          <main className="flex-1 ml-60 p-6 min-h-screen relative overflow-hidden">

            {/* Header */}
            <div className="flex items-center justify-between mb-6 fade-in">
              <div>
                <h1 className="text-2xl font-bold text-white flex items-center gap-2">
                  <span className="w-8 h-8 rounded-lg bg-rose-500/20 flex items-center justify-center">
                    <Icon d={I.alert} className="w-5 h-5 text-rose-400" />
                  </span>
                  Disruption Alerts ⚠️
                </h1>
                <p className="text-slate-400 text-sm mt-1">Real-time alerts impacting your active itinerary in Puri, Odisha.</p>
              </div>

              <div className="flex items-center gap-3">
                <div className="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-rose-500/30 bg-rose-500/10 text-rose-400 text-xs font-semibold">
                  <span className="w-2 h-2 rounded-full bg-rose-500 pulse-dot" /> Live Monitoring Active
                </div>
              </div>
            </div>

            <div className="grid grid-cols-12 gap-6">

              {/* Left Column: Alert Feed */}
              <div className="col-span-12 lg:col-span-5 space-y-4 fade-in" style={{ animationDelay: '0.1s' }}>
                <p className="text-sm font-semibold text-white px-1">Active Alerts ({DISRUPTIONS.length})</p>

                <div className="space-y-3">
                  {DISRUPTIONS.map(alt => {
                    const cfg = SEVERITY_CFG[alt.severity];
                    const isSelected = selectedAlert === alt.id;
                    return (
                      <div
                        key={alt.id}
                        onClick={() => setSelectedAlert(alt.id)}
                        className={`card p-4 rounded-xl cursor-pointer transition-all ${isSelected ? 'border-rose-500/50 bg-white/[0.03]' : 'hover:border-slate-600'}`}
                        style={isSelected ? { boxShadow: `0 0 20px ${cfg.color}15, inset 0 0 0 1px ${cfg.color}30` } : {}}
                      >
                        <div className="flex justify-between items-start mb-2">
                          <span className="chip text-[10px] px-2 py-0.5 font-bold uppercase tracking-wider" style={{ background: cfg.color + '20', color: cfg.color }}>
                            {cfg.label}
                          </span>
                          <span className="text-[10px] text-slate-500 font-medium">Just now</span>
                        </div>
                        <p className="text-white font-semibold text-sm mb-1">{alt.title}</p>
                        <p className="text-xs text-slate-400 mb-3 line-clamp-2">{alt.desc}</p>

                        <div className="flex items-center gap-4 text-[11px] text-slate-500">
                          <span className="flex items-center gap-1"><Icon d={I.pin} className="w-3.5 h-3.5" /> {alt.loc}</span>
                        </div>
                      </div>
                    )
                  })}

                  <div className="card p-4 rounded-xl border-dashed border-slate-700 bg-transparent flex flex-col items-center justify-center text-center py-8">
                    <Icon d={I.shield} className="w-8 h-8 text-emerald-500/50 mb-2" />
                    <p className="text-sm text-slate-300 font-medium">No other disruptions</p>
                    <p className="text-xs text-slate-500 mt-1">All other systems and routes are clear.</p>
                  </div>
                </div>
              </div>

              {/* Right Column: Alert Detail & Resolution */}
              <div className="col-span-12 lg:col-span-7 fade-in" style={{ animationDelay: '0.2s' }}>
                <div className="card rounded-2xl overflow-hidden h-full flex flex-col shadow-2xl">

                  {/* Top Map / Context Header */}
                  <div className="h-40 relative bg-panel2 map-pattern flex items-center justify-center overflow-hidden border-b border-line">
                    <div className="absolute inset-0 bg-gradient-to-t from-panel to-transparent" />

                    {/* Simulated Map Dot */}
                    <div className="relative z-10 text-center">
                      <div className="w-12 h-12 rounded-full mx-auto flex items-center justify-center shadow-lg pulse-dot" style={{ background: sCfg.color + '20' }}>
                        <div className="w-6 h-6 rounded-full flex items-center justify-center" style={{ background: sCfg.color }}>
                          <Icon d={I[sCfg.icon]} className="w-3 h-3 text-white" />
                        </div>
                      </div>
                      <span className="inline-block mt-3 px-3 py-1 rounded-full text-xs font-semibold shadow-lg" style={{ background: '#111a2e', color: sCfg.color, border: `1px solid ${sCfg.color}40` }}>
                        📍 {activeData.loc}
                      </span>
                    </div>
                  </div>

                  {/* Detail Body */}
                  <div className="p-6 flex-1 flex flex-col">

                    <div className="mb-6">
                      <div className="flex items-center gap-2 mb-2">
                        <span className="chip text-[10px] px-2 py-0.5 font-bold uppercase" style={{ background: sCfg.color + '20', color: sCfg.color }}>{activeData.type}</span>
                        <span className="text-xs text-slate-400 font-medium">Ref: {activeData.id}</span>
                      </div>
                      <h2 className="text-2xl font-bold text-white mb-2">{activeData.title}</h2>
                      <div className="flex items-center gap-3 text-xs text-slate-400">
                        <span className="flex items-center gap-1"><Icon d={I.clock} className="w-3.5 h-3.5" /> {activeData.date}</span>
                      </div>
                      <p className="text-sm text-slate-300 mt-4 leading-relaxed">{activeData.desc}</p>
                    </div>

                    <div className="bg-rose-500/5 border border-rose-500/20 rounded-xl p-4 mb-6">
                      <p className="text-sm font-semibold text-white mb-1 flex items-center gap-2">
                        <Icon d={I.impact} className="w-4 h-4 text-rose-400" /> Itinerary Impact
                      </p>
                      <p className="text-xs text-slate-400 mb-3">{activeData.impact}</p>

                      <div className="space-y-2">
                        {activeData.affectedActivities.map((act, i) => (
                          <div key={i} className="flex items-center justify-between p-2 rounded-lg bg-panel border border-line">
                            <div className="flex items-center gap-3">
                              <span className="text-xs font-medium text-slate-500 w-16">{act.time}</span>
                              <span className="text-sm text-slate-200 line-through decoration-rose-500/50">{act.name}</span>
                            </div>
                            <span className="text-xs text-slate-500">{act.origCost}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Recommendation */}
                    <div className="mt-auto border-t border-line pt-6">
                      <p className="text-sm font-semibold text-emerald-400 mb-3 flex items-center gap-2">
                        <Icon d={I.check} className="w-4 h-4" /> Recommended Action
                      </p>
                      <div className="flex items-start justify-between gap-4">
                        <div>
                          <p className="text-white font-medium text-sm mb-1">{activeData.recommendation.title}</p>
                          <p className="text-xs text-slate-400">{activeData.recommendation.desc}</p>
                        </div>
                        <button className="shrink-0 px-4 py-2 rounded-lg text-sm font-semibold text-white transition-all hover:-translate-y-0.5 shadow-lg shadow-emerald-500/20 flex items-center gap-2" style={{ background: 'linear-gradient(135deg, #10b981, #059669)' }}>
                          <Icon d={I.swap} className="w-4 h-4" /> {activeData.recommendation.actionLabel}
                        </button>
                      </div>
                    </div>

                  </div>
                </div>
              </div>

            </div>

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DisruptionAlert />);
  </script>
</body>

</html>
