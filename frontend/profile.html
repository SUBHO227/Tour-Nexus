        body {
            background: #0b1220;
            font-family: Inter, system-ui, sans-serif
        }

        .card {
            background: #111a2e;
            border: 1px solid #1f2b45
        }

        .chip {
            border-radius: 9999px
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0b1220;
        }

        ::-webkit-scrollbar-thumb {
            background: #1f2b45;
            border-radius: 3px;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .4;
            }
        }

        @keyframes progressFill {
            from {
                width: 0%;
            }
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        .progress-fill {
            animation: progressFill 1s ease forwards;
        }

        .day-card {
            transition: all 0.2s ease;
        }

        .day-card:hover {
            border-color: #6366f140;
        }

        .day-card.active-day {
            border-color: #6366f1;
            box-shadow: 0 0 0 1px #6366f130, 0 4px 20px #6366f115;
        }

        .act-row {
            transition: all 0.18s;
        }

        .act-row:hover {
            background: rgba(99, 102, 241, 0.04);
        }

        .timeline-dot {
            position: relative;
        }

        .timeline-dot::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 100%;
            transform: translateX(-50%);
            width: 2px;
            height: 100%;
            background: #1f2b45;
        }

        .timeline-dot.last::before {
            display: none;
        }

        .tab-active {
            background: #6366f1;
            color: white;
        }

        .tab-inactive {
            color: #94a3b8;
        }

        .tab-inactive:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.8);
                opacity: 0.5;
            }

            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeSlide 0.4s ease forwards;
        }

        .pulse-dot {
            position: relative;
        }

        .pulse-dot::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: inherit;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .map-pattern {
            background-image: radial-gradient(#1f2b45 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .graph-wrap {
            position: relative;
            width: 100%;
            height: 360px;
            overflow: hidden;
        }

        .graph-node {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            line-height: 1.2;
            border: 2px solid transparent;
        }

        .graph-node:hover {
            transform: scale(1.12);
            z-index: 10;
        }

        .graph-node.active-gn {
            transform: scale(1.15);
            z-index: 10;
        }

        @keyframes dv-progressFill {
            from {
                width: 0%;
            }

            to {
                width: var(--dvpct);
            }
        }

        .dv-bar-fill {
            animation: dv-progressFill 1.1s ease forwards;
        }

        .ripple {
            position: relative;
            overflow: hidden;
        }

        .ripple::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .ripple:active::after {
            opacity: 1;
        }

        /* ── Alternative Recommendations ── */
        .alt-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .alt-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .alt-card.ar-selected {
            border-color: #6366f1;
            box-shadow: 0 0 0 1px #6366f130, 0 8px 24px #6366f115;
        }

        .score-ring {
            transition: stroke-dasharray 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes ar-fill {
            from {
                width: 0%;
            }

            to {
                width: var(--arpct);
            }
        }

        .ar-bar {
            animation: ar-fill 1s ease forwards;
        }

        /* ── Updated Itinerary ── */
        .day-card {
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .day-card:hover {
            border-color: #6366f140;
        }

        .day-card.ui-expanded {
            border-color: #6366f1;
            box-shadow: 0 0 0 1px #6366f115, 0 8px 24px #6366f110;
        }

        .activity-row {
            transition: background 0.15s ease;
        }

        .activity-row:hover {
            background: #ffffff06;
        }

        @keyframes checkPop {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            70% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .check-pop {
            animation: checkPop 0.3s ease forwards;
        }

        .save-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            box-shadow: 0 4px 14px #6366f130;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px #6366f140;
        }

        /* ── Destination & Preferences ── */
        .dest-card {
            transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .dest-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
        }

        .dest-card.dp-selected {
            border-color: #6366f1;
            box-shadow: 0 0 0 1px #6366f130, 0 8px 24px #6366f118;
        }

        .pref-chip {
            border: 1px solid #1f2b45;
            transition: all 0.15s ease;
            cursor: pointer;
            user-select: none;
        }

        .pref-chip:hover {
            border-color: #6366f160;
        }

        .pref-chip.dp-active {
            border-color: #6366f1;
            background: #6366f115;
            color: #818cf8;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #1f2b45;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #6366f1;
            cursor: pointer;
            box-shadow: 0 0 0 3px #6366f130;
            transition: box-shadow 0.2s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            box-shadow: 0 0 0 6px #6366f125;
        }

        .dp-input {
            background: #0f1830;
            border: 1px solid #1f2b45;
            color: #e2e8f0;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }

        .dp-input:focus {
            border-color: #6366f1;
        }

        .dp-input::placeholder {
            color: #475569;
        }

        .dest-thumb {
            height: 90px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        /* ── Interactive Map ── */
        .map-pattern {
            background-image: radial-gradient(#1f2b45 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        .map-node {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .map-node:hover {
            transform: scale(1.25);
        }

        .pref-chip {
            border: 1px solid #1f2b45;
            transition: all 0.15s ease;
            cursor: pointer;
            user-select: none;
        }

        .pref-chip:hover {
            border-color: #6366f160;
        }

        .pref-chip.active {
            border-color: #6366f1;
            background: #6366f115;
            color: #818cf8;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.8);
                opacity: 0.5;
            }

            100% {
                transform: scale(2.2);
                opacity: 0;
            }
        }

        .ping-dot {
            position: relative;
        }

        .ping-dot::before {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: inherit;
            animation: pulse-ring 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -40;
            }
        }

        .route-path {
            stroke-dasharray: 8, 4;
            animation: dash 2.5s linear infinite;
        }

        @keyframes alert-glow {

            0%,
            100% {
                fill: rgba(244, 63, 94, 0.08);
                stroke: rgba(244, 63, 94, 0.2);
            }

            50% {
                fill: rgba(244, 63, 94, 0.15);
                stroke: rgba(244, 63, 94, 0.4);
            }
        }

        .disruption-zone {
            animation: alert-glow 3s ease-in-out infinite;
        }
    </style>
</head>
