<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alternative Recommendations - TRAVEL-X</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { bg: '#0b1220', panel: '#111a2e', panel2: '#0f1830', line: '#1f2b45' }
        }
      }
    }
  </script>
  <style>
    body {
      background: #0b1220;
      font-family: Inter, system-ui, sans-serif;
      color: #e2e8f0;
    }

    .card {
      background: #111a2e;
      border: 1px solid #1f2b45;
    }

    .chip {
      border-radius: 9999px;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0b1220; }
    ::-webkit-scrollbar-thumb { background: #1f2b45; border-radius: 3px; }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeSlide 0.35s ease forwards; }

    @keyframes pulseRing {
      0%   { transform: scale(0.85); opacity: 0.6; }
      100% { transform: scale(2);    opacity: 0; }
    }
    .pulse-dot { position: relative; }
    .pulse-dot::before {
      content: ''; position: absolute; inset: -4px;
      border-radius: 50%; background: inherit;
      animation: pulseRing 2s cubic-bezier(0.215,0.61,0.355,1) infinite;
    }

    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .score-ring { transition: stroke-dasharray 0.8s cubic-bezier(0.4,0,0.2,1); }

    .alt-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .alt-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .alt-card.selected {
      border-color: #6366f1;
      box-shadow: 0 0 0 1px #6366f130, 0 8px 24px #6366f115;
    }

    @keyframes progressFill {
      from { width: 0%; }
      to   { width: var(--pct); }
    }
    .bar-fill { animation: progressFill 1s ease forwards; }

    .tag-badge {
      font-size: 10px; font-weight: 700;
      padding: 2px 8px; border-radius: 9999px;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const Icon = ({ d, className = 'w-5 h-5', style }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none"
           stroke="currentColor" strokeWidth="2" style={style}>
        <path strokeLinecap="round" strokeLinejoin="round" d={d} />
      </svg>
    );

    const I = {
      home:    'M3 12l9-9 9 9M5 10v10h14V10',
      alert:   'M12 9v4m0 4h.01M10.29 3.86l-8.48 14.7A1 1 0 0 0 2.66 20h18.68a1 1 0 0 0 .85-1.44L13.71 3.86a1 1 0 0 0-1.72 0Z',
      map:     'M9 20l-6-3V4l6 3 6-3 6 3v13l-6-3-6 3zM9 7v13M15 4v13',
      users:   'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
      report:  'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM14 2v6h6M9 13h6M9 17h6',
      star:    'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z',
      check:   'M20 6L9 17l-5-5',
      pin:     'M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0zM12 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
      clock:   'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 6v6l4 2',
      swap:    'M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4',
      shield:  'M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z',
      heart:   'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z',
      info:    'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 16v-4M12 8h.01',
      route:   'M3 12h18M3 6h18M3 18h18',
      impact:  'M3 3v18h18M7 15l4-6 3 4 5-8',
      chevron: 'M9 18l6-6-6-6',
      net:     'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z',
    };

    /* ── Sidebar ───────────────────────────────────────────────── */
    const Sidebar = () => (
      <aside className="w-60 bg-panel border-r border-line flex flex-col py-4 shrink-0 fixed h-full z-10">
        <div className="flex items-center gap-2 px-4 mb-8 mt-2">
          <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
            <Icon d={I.map} className="w-4 h-4 text-white" />
          </div>
          <div>
            <p className="font-bold text-white text-sm leading-none tracking-wide">TRAVEL-X</p>
            <p className="text-[10px] text-slate-500 font-medium">Smart Tourism Platform</p>
          </div>
        </div>
        <div>
          <p className="px-4 text-[11px] tracking-widest text-slate-500 font-semibold mb-2">TOURIST APP</p>
          {[
            ['home',    'Dashboard'],
            ['users',   'Tourist Profile'],
            ['report',  'Itinerary Generation'],
            ['map',     'Current Itinerary'],
            ['alert',   'Disruption Alert'],
            ['net',     'Dependency / Impact View'],
            ['swap',    'Alternative Recommendations', true],
          ].map(([icon, label, active], i) => (
            <div key={i}
              className={`flex items-center gap-3 px-4 py-2.5 mx-2 rounded-lg cursor-pointer text-sm font-medium transition-all
                ${active ? 'bg-indigo-600/15 text-indigo-400' : 'text-slate-400 hover:bg-white/5 hover:text-slate-200'}`}>
              <Icon d={I[icon]} className="w-4 h-4" />
              <span>{label}</span>
            </div>
          ))}
        </div>
      </aside>
    );

    /* ── DATA ──────────────────────────────────────────────────── */
    const ORIGINAL = {
      day: 'Day 2 — Konark & Marine Drive',
      date: '13 Dec 2025 (Saturday)',
      disruption: 'Heavy Rainfall + Road Closure',
      activities: [
        { time: '09:00 AM', name: 'Konark Sun Temple Visit', cost: '₹40',  status: 'disrupted' },
        { time: '11:30 AM', name: 'Chandrabhaga Beach',      cost: 'Free', status: 'disrupted' },
        { time: '01:30 PM', name: 'Transit via Marine Drive',cost: '₹120', status: 'delayed'   },
        { time: '03:00 PM', name: 'Panthanivas Konark Lunch',cost: '₹600', status: 'ok'        },
        { time: '05:00 PM', name: 'Return to Puri Hotel',    cost: '₹200', status: 'ok'        },
      ]
    };

    const ALTERNATIVES = [
      {
        id: 'alt-1',
        title: 'Indoor Heritage Day',
        tagline: 'Culture & History without the rain',
        score: 92,
        scoreColor: '#22c55e',
        tags: ['Highly Recommended', '#22c55e'],
        costDelta: '₹180 saved',
        timeDelta: 'Same schedule',
        safetyScore: 98,
        satisfactionScore: 88,
        activities: [
          { time: '09:30 AM', name: 'Odisha State Museum, Bhubaneswar', cost: '₹20',  icon: '🏛️' },
          { time: '11:30 AM', name: 'Dhauli Peace Pagoda',              cost: 'Free', icon: '☮️' },
          { time: '01:00 PM', name: 'Lunch at Dalma Restaurant',        cost: '₹450', icon: '🍽️' },
          { time: '03:00 PM', name: 'Raghurajpur Craft Village',        cost: '₹30',  icon: '🎨' },
          { time: '05:30 PM', name: 'Return to Puri Hotel',             cost: '₹350', icon: '🚗' },
        ],
        pros: ['Fully indoors / sheltered', 'No traffic delays', 'UNESCO-listed heritage sites', 'Richer cultural experience'],
        cons: ['30 km extra from Puri', 'Additional transport cost'],
        route: 'Puri → Bhubaneswar → Dhauli → Raghurajpur → Puri',
        totalCost: '₹850',
      },
      {
        id: 'alt-2',
        title: 'Afternoon Konark (Delayed Start)',
        tagline: 'Wait for rain to clear, visit post-noon',
        score: 74,
        scoreColor: '#f59e0b',
        tags: ['Moderate Match', '#f59e0b'],
        costDelta: 'Same cost',
        timeDelta: '+3 hr delay',
        safetyScore: 72,
        satisfactionScore: 78,
        activities: [
          { time: '12:30 PM', name: 'Late Breakfast at Hotel',         cost: 'Hotel', icon: '☕' },
          { time: '01:00 PM', name: 'Konark Sun Temple (post-rain)',    cost: '₹40',  icon: '🌤️' },
          { time: '03:30 PM', name: 'Chandrabhaga Beach (if clear)',    cost: 'Free', icon: '🏖️' },
          { time: '05:00 PM', name: 'Panthanivas Konark (early dinner)',cost: '₹600', icon: '🍽️' },
          { time: '07:00 PM', name: 'Return to Puri Hotel',            cost: '₹200', icon: '🚗' },
        ],
        pros: ['Preserves original itinerary', 'No extra cost', 'Morning free for relaxing'],
        cons: ['Weather dependent', 'Rushed afternoon schedule', 'Risk of further delays'],
        route: 'Same route — Puri → Konark → Marine Drive → Puri',
        totalCost: '₹960',
      },
      {
        id: 'alt-3',
        title: 'Puri Intra-City Exploration',
        tagline: 'Skip Konark, explore Puri deeply',
        score: 68,
        scoreColor: '#6366f1',
        tags: ['Low Priority', '#6366f1'],
        costDelta: '₹320 saved',
        timeDelta: 'Flexible',
        safetyScore: 95,
        satisfactionScore: 65,
        activities: [
          { time: '10:00 AM', name: 'Jagannath Temple Exterior View',  cost: 'Free', icon: '🛕' },
          { time: '11:30 AM', name: 'Swargadwar Beach Walk',           cost: 'Free', icon: '🚶' },
          { time: '01:00 PM', name: 'Wildgrass Restaurant Lunch',      cost: '₹500', icon: '🍽️' },
          { time: '03:00 PM', name: 'Puri Sea Beach (covered spot)',   cost: 'Free', icon: '⛱️' },
          { time: '05:00 PM', name: 'Local Market & Souvenir Shopping',cost: '₹200', icon: '🛍️' },
        ],
        pros: ['Closest to hotel — no transport risk', 'Lowest cost', 'Safest option in rain'],
        cons: ['Misses Konark entirely', 'Less culturally diverse', 'Lower satisfaction'],
        route: 'Puri only — no highway travel needed',
        totalCost: '₹700',
      },
    ];

    /* ── Sub-components ────────────────────────────────────────── */
    const StatusDot = ({ status }) => {
      const map = { disrupted: ['#f43f5e', 'Disrupted'], delayed: ['#f59e0b', 'Delayed'], ok: ['#22c55e', 'On Track'] };
      const [color, label] = map[status] || ['#64748b', 'Unknown'];
      return (
        <span className="tag-badge inline-flex items-center gap-1"
          style={{ background: color + '20', color }}>
          <span className="w-1.5 h-1.5 rounded-full" style={{ background: color }} />
          {label}
        </span>
      );
    };

    const ScoreRing = ({ score, color, size = 56 }) => {
      const r = 22; const circ = 2 * Math.PI * r;
      const dash = (score / 100) * circ;
      return (
        <div className="relative" style={{ width: size, height: size }}>
          <svg width={size} height={size} viewBox="0 0 56 56" className="-rotate-90">
            <circle cx="28" cy="28" r={r} stroke="#1f2b45" strokeWidth="5" fill="none" />
            <circle cx="28" cy="28" r={r} stroke={color} strokeWidth="5" fill="none"
              strokeLinecap="round"
              strokeDasharray={`${dash} ${circ}`}
              className="score-ring" />
          </svg>
          <div className="absolute inset-0 flex items-center justify-center">
            <p className="text-xs font-black" style={{ color }}>{score}</p>
          </div>
        </div>
      );
    };

    /* ── Main Component ─────────────────────────────────────────── */
    const AlternativeRecommendations = () => {
      const [selected, setSelected] = useState('alt-1');
      const [adopted, setAdopted]   = useState(false);

      const activeAlt = ALTERNATIVES.find(a => a.id === selected);

      return (
        <div className="flex min-h-screen">
          <Sidebar />

          <main className="flex-1 ml-60 p-6 min-h-screen">

            {/* Header */}
            <div className="flex items-center justify-between mb-6 fade-in">
              <div>
                <h1 className="text-2xl font-bold text-white flex items-center gap-2">
                  <span className="w-8 h-8 rounded-lg bg-indigo-500/20 flex items-center justify-center">
                    <Icon d={I.swap} className="w-5 h-5 text-indigo-400" />
                  </span>
                  Alternative Recommendations 🔄
                </h1>
                <p className="text-slate-400 text-sm mt-1">
                  AI-suggested itinerary alternatives based on current disruptions for <span className="text-indigo-300 font-medium">Day 2 — Konark & Marine Drive</span>.
                </p>
              </div>
              <div className="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-amber-500/30 bg-amber-500/10 text-amber-400 text-xs font-semibold">
                <span className="w-2 h-2 rounded-full bg-amber-400 pulse-dot" /> AI-Powered Suggestions
              </div>
            </div>

            {/* Original Plan Banner */}
            <div className="card rounded-2xl p-4 mb-6 fade-in border-amber-500/20"
              style={{ animationDelay: '0.05s', borderColor: '#f59e0b30', background: '#0f1a0a' }}>
              <div className="flex items-center justify-between mb-3">
                <p className="text-sm font-semibold text-amber-400 flex items-center gap-2">
                  <Icon d={I.alert} className="w-4 h-4" /> Original Plan — Disrupted
                </p>
                <div className="flex gap-2">
                  <span className="tag-badge" style={{ background: '#f43f5e20', color: '#f43f5e' }}>Heavy Rainfall</span>
                  <span className="tag-badge" style={{ background: '#f59e0b20', color: '#f59e0b' }}>Road Closure</span>
                </div>
              </div>
              <div className="flex gap-4 overflow-x-auto pb-1">
                {ORIGINAL.activities.map((act, i) => (
                  <div key={i} className="shrink-0 p-3 rounded-xl min-w-[150px]"
                    style={{
                      background: act.status === 'disrupted' ? '#f43f5e0a' : act.status === 'delayed' ? '#f59e0b0a' : '#22c55e0a',
                      border: `1px solid ${act.status === 'disrupted' ? '#f43f5e30' : act.status === 'delayed' ? '#f59e0b30' : '#22c55e30'}`
                    }}>
                    <p className="text-[10px] text-slate-500 mb-1">{act.time}</p>
                    <p className="text-xs text-slate-200 font-medium leading-snug mb-2">{act.name}</p>
                    <div className="flex items-center justify-between">
                      <span className="text-[10px] text-slate-400">{act.cost}</span>
                      <StatusDot status={act.status} />
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Alternatives Grid */}
            <div className="grid grid-cols-12 gap-6">

              {/* Left: Cards */}
              <div className="col-span-5 space-y-4 fade-in" style={{ animationDelay: '0.1s' }}>
                <p className="text-sm font-semibold text-white px-1">Select an Alternative ({ALTERNATIVES.length} options)</p>
                {ALTERNATIVES.map((alt, idx) => (
                  <div key={alt.id}
                    onClick={() => setSelected(alt.id)}
                    className={`alt-card card p-4 rounded-2xl cursor-pointer ${selected === alt.id ? 'selected' : ''}`}>

                    <div className="flex items-start justify-between mb-3">
                      <div className="flex items-center gap-3">
                        <div className="w-6 h-6 rounded-full flex items-center justify-center text-xs font-black"
                          style={{ background: alt.scoreColor + '20', color: alt.scoreColor }}>
                          {idx + 1}
                        </div>
                        <div>
                          <p className="text-white font-bold text-sm">{alt.title}</p>
                          <p className="text-xs text-slate-400 mt-0.5">{alt.tagline}</p>
                        </div>
                      </div>
                      <ScoreRing score={alt.score} color={alt.scoreColor} size={52} />
                    </div>

                    <div className="flex items-center gap-2 mb-3">
                      <span className="tag-badge" style={{ background: alt.tags[1] + '20', color: alt.tags[1] }}>
                        {alt.tags[0]}
                      </span>
                    </div>

                    <div className="flex gap-4 text-[11px]">
                      <div className="flex items-center gap-1 text-emerald-400">
                        <Icon d={I.impact} className="w-3 h-3" /> {alt.costDelta}
                      </div>
                      <div className="flex items-center gap-1 text-slate-400">
                        <Icon d={I.clock} className="w-3 h-3" /> {alt.timeDelta}
                      </div>
                    </div>

                    {selected === alt.id && (
                      <div className="mt-3 pt-3 border-t border-line flex items-center gap-1.5 text-indigo-400 text-xs font-semibold">
                        <Icon d={I.check} className="w-3.5 h-3.5" /> Currently viewing
                      </div>
                    )}
                  </div>
                ))}
              </div>

              {/* Right: Detail */}
              <div className="col-span-7 fade-in" style={{ animationDelay: '0.15s' }}>
                <div className="card rounded-2xl overflow-hidden h-full flex flex-col"
                  style={{ borderColor: activeAlt.scoreColor + '30', boxShadow: `0 0 24px ${activeAlt.scoreColor}10` }}>

                  {/* Header bar */}
                  <div className="px-5 py-4 border-b border-line flex items-center justify-between"
                    style={{ background: activeAlt.scoreColor + '08' }}>
                    <div>
                      <p className="text-white font-bold text-base">{activeAlt.title}</p>
                      <p className="text-xs text-slate-400 mt-0.5 flex items-center gap-1">
                        <Icon d={I.pin} className="w-3.5 h-3.5" /> {activeAlt.route}
                      </p>
                    </div>
                    <div className="flex items-center gap-3">
                      <div className="text-center">
                        <p className="text-[10px] text-slate-500 mb-1">Safety</p>
                        <ScoreRing score={activeAlt.safetyScore} color="#22c55e" size={44} />
                      </div>
                      <div className="text-center">
                        <p className="text-[10px] text-slate-500 mb-1">Satisfaction</p>
                        <ScoreRing score={activeAlt.satisfactionScore} color="#a855f7" size={44} />
                      </div>
                      <div className="text-center">
                        <p className="text-[10px] text-slate-500 mb-1">Match</p>
                        <ScoreRing score={activeAlt.score} color={activeAlt.scoreColor} size={44} />
                      </div>
                    </div>
                  </div>

                  {/* Activities timeline */}
                  <div className="p-5 flex-1">
                    <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">
                      Suggested Schedule
                    </p>
                    <div className="space-y-3 mb-5">
                      {activeAlt.activities.map((act, i) => (
                        <div key={i} className="flex items-center gap-3 p-3 rounded-xl"
                          style={{ background: '#0f1830', border: '1px solid #1f2b45' }}>
                          <span className="text-xl w-8 shrink-0 text-center">{act.icon}</span>
                          <div className="flex-1 min-w-0">
                            <p className="text-sm text-white font-medium truncate">{act.name}</p>
                            <p className="text-xs text-slate-500 mt-0.5">{act.time}</p>
                          </div>
                          <span className="text-xs font-bold shrink-0" style={{ color: activeAlt.scoreColor }}>
                            {act.cost}
                          </span>
                        </div>
                      ))}
                    </div>

                    {/* Pros / Cons */}
                    <div className="grid grid-cols-2 gap-4 mb-5">
                      <div className="p-3 rounded-xl" style={{ background: '#22c55e0a', border: '1px solid #22c55e20' }}>
                        <p className="text-[11px] font-bold text-emerald-400 mb-2 flex items-center gap-1">
                          <Icon d={I.check} className="w-3.5 h-3.5" /> Why Choose This
                        </p>
                        <ul className="space-y-1.5">
                          {activeAlt.pros.map((p, i) => (
                            <li key={i} className="flex items-start gap-1.5 text-[11px] text-slate-300">
                              <span className="text-emerald-500 mt-0.5 shrink-0">✓</span> {p}
                            </li>
                          ))}
                        </ul>
                      </div>
                      <div className="p-3 rounded-xl" style={{ background: '#f43f5e0a', border: '1px solid #f43f5e20' }}>
                        <p className="text-[11px] font-bold text-rose-400 mb-2 flex items-center gap-1">
                          <Icon d={I.info} className="w-3.5 h-3.5" /> Trade-offs
                        </p>
                        <ul className="space-y-1.5">
                          {activeAlt.cons.map((c, i) => (
                            <li key={i} className="flex items-start gap-1.5 text-[11px] text-slate-300">
                              <span className="text-rose-500 mt-0.5 shrink-0">✗</span> {c}
                            </li>
                          ))}
                        </ul>
                      </div>
                    </div>

                    {/* Cost footer */}
                    <div className="flex items-center justify-between pt-4 border-t border-line">
                      <div>
                        <p className="text-xs text-slate-400">Estimated Day Cost</p>
                        <p className="text-lg font-black text-white">{activeAlt.totalCost}</p>
                      </div>
                      <div className="flex gap-3">
                        <button className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold border border-line text-slate-300 hover:text-white hover:border-slate-500 transition-all">
                          <Icon d={I.heart} className="w-4 h-4 text-rose-400" /> Save
                        </button>
                        {adopted && selected === activeAlt.id ? (
                          <div className="flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-semibold text-emerald-400"
                            style={{ background: '#22c55e15', border: '1px solid #22c55e40' }}>
                            <Icon d={I.check} className="w-4 h-4" /> Adopted!
                          </div>
                        ) : (
                          <button
                            onClick={() => setAdopted(true)}
                            className="flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold text-white transition-all hover:-translate-y-0.5 shadow-lg"
                            style={{ background: `linear-gradient(135deg, ${activeAlt.scoreColor}, ${activeAlt.scoreColor}cc)`,
                                     boxShadow: `0 4px 14px ${activeAlt.scoreColor}30` }}>
                            <Icon d={I.swap} className="w-4 h-4" /> Adopt This Plan
                          </button>
                        )}
                      </div>
                    </div>
                  </div>

                </div>
              </div>

            </div>

            {/* Comparison bar at bottom */}
            <div className="card rounded-2xl p-5 mt-6 fade-in" style={{ animationDelay: '0.2s' }}>
              <p className="text-sm font-semibold text-white mb-4">Comparison Overview</p>
              <div className="grid grid-cols-3 gap-4">
                {ALTERNATIVES.map(alt => (
                  <div key={alt.id} className={`p-4 rounded-xl cursor-pointer transition-all border ${selected === alt.id ? 'border-indigo-500/50 bg-indigo-500/5' : 'border-line hover:border-slate-600'}`}
                    onClick={() => setSelected(alt.id)}>
                    <div className="flex items-center justify-between mb-3">
                      <p className="text-white text-sm font-semibold">{alt.title}</p>
                      <ScoreRing score={alt.score} color={alt.scoreColor} size={40} />
                    </div>
                    <div className="space-y-2">
                      {[
                        ['Safety',      alt.safetyScore,      '#22c55e'],
                        ['Satisfaction',alt.satisfactionScore, '#a855f7'],
                        ['Cost Fit',    Math.round(alt.score * 0.85), '#0ea5e9'],
                      ].map(([label, val, color], i) => (
                        <div key={i}>
                          <div className="flex justify-between text-[10px] mb-1">
                            <span className="text-slate-500">{label}</span>
                            <span style={{ color }}>{val}%</span>
                          </div>
                          <div className="h-1 rounded-full overflow-hidden" style={{ background: '#0f1830' }}>
                            <div className="h-full rounded-full bar-fill"
                              style={{ '--pct': val + '%', width: val + '%', background: color }} />
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>

          </main>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<AlternativeRecommendations />);
  </script>
</body>

</html>
