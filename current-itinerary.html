      padding: 0;
    }

      background: #0b1220;

      color: #cbd5e1;
      min-height: 100vh;
    }

    .card {
      background: #111a2e;
      border: 1px solid #1f2b45;
    }

    .chip {
      border-radius: 9999px;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0b1220;
    }

    ::-webkit-scrollbar-thumb {
      background: #1f2b45;
      border-radius: 3px;
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .4;
      }
    }

    @keyframes progressFill {
      from {
        width: 0%;
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-8px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .fade-in {
      animation: fadeSlide 0.4s ease both;
    }

    .slide-in {
      animation: slideIn 0.3s ease both;
    }

    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }

    .progress-fill {
      animation: progressFill 1s ease forwards;
    }

    .day-card {
      transition: all 0.2s ease;
    }

    .day-card:hover {
      border-color: #6366f140;
    }

    .day-card.active-day {
      border-color: #6366f1;
      box-shadow: 0 0 0 1px #6366f130, 0 4px 20px #6366f115;
    }

    .act-row {
      transition: all 0.18s;
    }

    .act-row:hover {
      background: rgba(99, 102, 241, 0.04);
    }

    .timeline-dot {
      position: relative;
    }

    .timeline-dot::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 100%;
      transform: translateX(-50%);
      width: 2px;
      height: 100%;
      background: #1f2b45;
    }

    .timeline-dot.last::before {
      display: none;
    }

    input {
      background: #0f1830;
      border: 1px solid #1f2b45;
      color: #cbd5e1;
      outline: none;
    }

    input:focus {
      border-color: #6366f1;
    }

    .tab-active {
      background: #6366f1;
      color: white;
    }

    .tab-inactive {
      color: #94a3b8;
    }

    .tab-inactive:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
    }

    .alert-high {
      background: #f43f5e08;
      border-color: #f43f5e30;
    }

    .alert-med {
      background: #f59e0b08;
      border-color: #f59e0b30;
    }

    .alert-low {
      background: #22c55e08;
      border-color: #22c55e30;
    }
  </style>
</head>

                  <div className="card rounded-xl p-4" style={{ borderColor: '#22c55e30', background: '#22c55e05' }}>
                    <div className="flex items-center gap-3">
                      <div className="w-9 h-9 rounded-lg flex items-center justify-center bg-emerald-500/20">
                        <Icon d={I.check} className="w-4 h-4 text-emerald-400" />
                      </div>
                      <div>
                        <p className="text-emerald-400 font-semibold text-sm">Days 3–5 All Clear</p>
                        <p className="text-slate-500 text-xs mt-0.5">No alerts for Chilika Lake and Bhubaneswar days at this time.</p>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Right */}
                <div className="space-y-4">
                  {/* Alert Summary */}
                  <div className="card rounded-xl p-4">
                    <p className="text-white font-semibold text-sm mb-3">Alert Summary</p>
                    <div className="space-y-3">
                      {[
                        { label: 'High Impact', count: 1, color: '#f43f5e' },
                        { label: 'Medium Impact', count: 1, color: '#f59e0b' },
                        { label: 'Low Impact', count: 1, color: '#6366f1' },
                      ].map(({ label, count, color }, i) => (
                        <div key={i} className="flex items-center justify-between">
                          <div className="flex items-center gap-2">
                            <div className="w-2 h-2 rounded-full" style={{ background: color }} />
                            <span className="text-xs text-slate-400">{label}</span>
                          </div>
                          <span className="chip text-xs px-2 py-0.5 font-bold"
                            style={{ background: color + '20', color }}>{count}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Recommended actions */}
                  <div className="card rounded-xl p-4">
                    <p className="text-white font-semibold text-sm mb-3">Recommended Actions</p>
                    <div className="space-y-2">
                      {[
                        { label: 'View Alternative Routes', icon: 'swap', color: '#a855f7' },
                        { label: 'Check Updated Itinerary', icon: 'report', color: '#6366f1' },
                        { label: 'Contact Local Guide', icon: 'users', color: '#22c55e' },
                        { label: 'Enable Notifications', icon: 'bell', color: '#f59e0b' },
                      ].map(({ label, icon, color }, i) => (
                        <button key={i}
                          className="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs text-slate-300 hover:text-white border border-line hover:border-slate-600 transition-all text-left">
                          <Icon d={I[icon]} className="w-3.5 h-3.5 shrink-0" style={{ color }} />
                          {label}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Emergency */}
                  <div className="card rounded-xl p-4" style={{ borderColor: '#f43f5e20' }}>
                    <p className="text-rose-400 font-semibold text-sm mb-3 flex items-center gap-1.5">
                      <Icon d={I.alert} className="w-3.5 h-3.5" /> Emergency Contacts
                    </p>
                    <div className="space-y-2.5 text-xs">
                      {[
                        { label: 'Tourist Helpline', val: '1800-345-3736' },
                        { label: 'Local Police', val: '0674-2414070' },
                        { label: 'Ambulance', val: '108' },
                        { label: 'Tour Guide (Arjun)', val: '+91 98765 43210' },
                      ].map(({ label, val }, i) => (
                        <div key={i} className="flex justify-between">
                          <span className="text-slate-500">{label}</span>
                          <span className="text-slate-300 font-medium">{val}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CurrentItinerary />);
  </script>
</body>

</html>
