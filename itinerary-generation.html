  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0b1220',

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b1220;
      font-family: 'Inter', system-ui, sans-serif;
      color: #cbd5e1;
      min-height: 100vh;
    }

    .card {
      background: #111a2e;
      border: 1px solid #1f2b45;
    }

    .chip {
      border-radius: 9999px;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0b1220;
    }

    ::-webkit-scrollbar-thumb {
      background: #1f2b45;
      border-radius: 3px;
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin1 {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes progressFill {
      from {
        width: 0%;
      }
    }

    .fade-in {
      animation: fadeSlide 0.35s ease both;
    }

    .spinner {
      border: 2px solid #1f2b45;
      border-top-color: #6366f1;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin1 0.7s linear infinite;
    }

    .progress-fill {
      animation: progressFill 0.8s ease forwards;
    }

    .activity-card {
      transition: all 0.18s;
    }

    .activity-card:hover {
      border-color: #6366f140;
      transform: translateX(2px);
    }

    .tag-btn {
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }

    .tag-btn:hover {
      transform: scale(1.04);
    }

    input[type=range] {
      accent-color: #6366f1;
      cursor: pointer;
    }

    select,
    input[type=date],
    input[type=text] {
      background: #0f1830;
      border: 1px solid #1f2b45;
      color: #cbd5e1;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #6366f1;
    }

    option {
      background: #111a2e;
    }
  </style>
</head>

            </div>
            <div>
              <label className="text-xs text-slate-400 mb-1 block">End Date</label>
              <input type="date" defaultValue="2025-12-16" className="w-full rounded-lg px-3 py-2 text-sm"
                onChange={e => setForm({ ...form, endDate: e.target.value })} />
            </div>
          </div>
          <div className="mt-6 flex justify-end">
            <button onClick={onNext} disabled={!form.destination}
              className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-semibold px-6 py-2.5 rounded-lg transition">
              Next: Preferences <Icon d={I.arrow} className="w-4 h-4" />
            </button>
          </div>
        </div>
      );
    };

    /* ── Step 2: Preferences ────────────────────────────────── */
    const Step2 = ({ form, setForm, onNext, onBack }) => {
      const tog = (key, val) => {
        const a = form[key] || [];
        setForm({ ...form, [key]: a.includes(val) ? a.filter(x => x !== val) : [...a, val] });
      };
      return (
        <div className="fade-in">
          <h2 className="text-white font-semibold mb-1">Set your preferences</h2>
          <p className="text-slate-500 text-sm mb-5">Help us tailor the perfect itinerary for you.</p>

          <div className="card rounded-xl p-4 mb-4">
            <p className="text-sm font-semibold text-white mb-3 flex items-center gap-2">
              <Icon d={I.heart} className="w-4 h-4 text-rose-400" /> Interests
            </p>
            <div className="flex flex-wrap gap-2">
              {INTERESTS.map(t => <Pill key={t} text={t} active={(form.interests || []).includes(t)} onClick={() => tog('interests', t)} />)}
            </div>
          </div>

          <div className="card rounded-xl p-4 mb-4">
            <p className="text-sm font-semibold text-white mb-3 flex items-center gap-2">
              <Icon d={I.users} className="w-4 h-4 text-sky-400" /> Travel Style
            </p>
            <div className="flex flex-wrap gap-2">
              {STYLES.map(t => <Pill key={t} text={t} color="#0ea5e9" active={form.style === t} onClick={() => setForm({ ...form, style: t })} />)}
            </div>
          </div>

          <div className="card rounded-xl p-4 mb-4">
            <div className="flex justify-between items-center mb-3">
              <p className="text-sm font-semibold text-white flex items-center gap-2">
                <Icon d={I.report} className="w-4 h-4 text-emerald-400" /> Budget
              </p>
              <span className="text-indigo-400 text-sm font-bold">₹{(form.budget || 15000).toLocaleString()}</span>
            </div>
            <input type="range" min={5000} max={100000} step={1000}
              value={form.budget || 15000}
              onChange={e => setForm({ ...form, budget: +e.target.value })}
              className="w-full" />
            <div className="flex justify-between text-[11px] text-slate-500 mt-1">
              <span>₹5,000</span><span>₹1,00,000</span>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-4">
            <div className="card rounded-xl p-4">
              <p className="text-sm font-semibold text-white mb-3 flex items-center gap-2">
                <Icon d={I.clock} className="w-4 h-4 text-amber-400" /> Trip Pace
              </p>
              <div className="flex flex-col gap-2">
                {PACES.map(t => <Pill key={t} text={t} color="#f59e0b" active={form.pace === t} onClick={() => setForm({ ...form, pace: t })} />)}
              </div>
            </div>
            <div className="card rounded-xl p-4">
              <p className="text-sm font-semibold text-white mb-3 flex items-center gap-2">
                <Icon d={I.car} className="w-4 h-4 text-sky-400" /> Transport
              </p>
              <div className="flex flex-col gap-2">
                {TRANSPORTS.map(t => {
                  const a = form.transport || [];
                  return <Pill key={t} text={t} color="#0ea5e9" active={a.includes(t)}
                    onClick={() => setForm({ ...form, transport: a.includes(t) ? a.filter(x => x !== t) : [...a, t] })} />;
                })}
              </div>
            </div>
          </div>

          <div className="mt-6 flex justify-between">
            <button onClick={onBack} className="text-slate-400 hover:text-white text-sm px-5 py-2.5 rounded-lg border border-line transition">← Back</button>
            <button onClick={onNext} className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold px-6 py-2.5 rounded-lg transition">
              Next: Review <Icon d={I.arrow} className="w-4 h-4" />
            </button>
          </div>
        </div>
      );
    };

    /* ── Step 3: Review ─────────────────────────────────────── */
    const Step3 = ({ form, onNext, onBack }) => {
      const rows = [
        { label: 'Destination', val: form.destination || '—', color: '#6366f1' },
        { label: 'Dates', val: `${form.startDate || '12 Dec'} → ${form.endDate || '16 Dec'}`, color: '#0ea5e9' },
        { label: 'Interests', val: (form.interests || ['Beaches', 'Temples']).join(', '), color: '#f59e0b' },
        { label: 'Style', val: form.style || 'Family', color: '#a855f7' },
        { label: 'Budget', val: `₹${(form.budget || 15000).toLocaleString()}`, color: '#22c55e' },
        { label: 'Pace', val: form.pace || 'Moderate', color: '#f43f5e' },
        { label: 'Transport', val: (form.transport || ['Train']).join(', '), color: '#0ea5e9' },
      ];
      return (
        <div className="fade-in">
          <h2 className="text-white font-semibold mb-1">Review your inputs</h2>
          <p className="text-slate-500 text-sm mb-5">Everything look good? Let's generate your itinerary!</p>

          <div className="card rounded-xl p-5 mb-4" style={{ borderColor: '#6366f130' }}>
            <div className="flex items-center gap-2 mb-4">
              <div className="w-8 h-8 rounded-lg flex items-center justify-center bg-indigo-600/20">
                <Icon d={I.spark} className="w-4 h-4 text-indigo-400" />
              </div>
              <div>
                <p className="text-white font-semibold text-sm">AI-Ready Summary</p>
                <p className="text-slate-500 text-xs">Verified · Ready to generate</p>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              {rows.map(({ label, val, color }, i) => (
                <div key={i} className="p-3 rounded-lg flex items-start gap-2"
                  style={{ background: color + '0d', border: `1px solid ${color}20` }}>
                  <div className="w-1.5 h-1.5 rounded-full mt-1.5 shrink-0" style={{ background: color }} />
                  <div>
                    <p className="text-[10px] text-slate-500 mb-0.5">{label}</p>
                    <p className="text-xs font-medium text-slate-200">{val}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div className="p-4 rounded-xl mb-5" style={{ background: '#0f2518', border: '1px solid #22c55e30' }}>
            <div className="flex items-start gap-3">
              <Icon d={I.check} className="w-4 h-4 text-emerald-400 mt-0.5 shrink-0" />
              <div>
                <p className="text-emerald-400 text-sm font-semibold mb-0.5">No disruptions detected</p>
                <p className="text-slate-400 text-xs">Your selected dates & destination are clear. No active alerts.</p>
              </div>
            </div>
          </div>

          <div className="flex justify-between">
            <button onClick={onBack} className="text-slate-400 hover:text-white text-sm px-5 py-2.5 rounded-lg border border-line transition">← Back</button>
            <button onClick={onNext}
              className="flex items-center gap-2 text-white text-sm font-bold px-8 py-2.5 rounded-lg transition shadow-lg shadow-indigo-900/40"
              style={{ background: 'linear-gradient(135deg,#6366f1,#a855f7)' }}>
              <Icon d={I.spark} className="w-4 h-4" /> Generate Itinerary
            </button>
          </div>
        </div>
      );
    };

    /* ── Step 4: AI Generation Animation ───────────────────── */
    const Step4 = ({ onDone }) => {
      const [cur, setCur] = useState(0);
      const pct = Math.round((cur / AI_STEPS.length) * 100);
      const r = 44;

      useEffect(() => {
        if (cur >= AI_STEPS.length) { setTimeout(onDone, 500); return; }
        const t = setTimeout(() => setCur(c => c + 1), 700);
        return () => clearTimeout(t);
      }, [cur]);

      return (
        <div className="flex flex-col items-center justify-center py-14 fade-in">
          <div className="relative w-32 h-32 mb-6">
            <svg className="w-32 h-32 -rotate-90" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r={r} fill="none" stroke="#1f2b45" strokeWidth="6" />
              <circle cx="50" cy="50" r={r} fill="none" stroke="url(#g1)" strokeWidth="6"
                strokeLinecap="round"
                strokeDasharray={`${2 * Math.PI * r}`}
                strokeDashoffset={`${2 * Math.PI * r * (1 - pct / 100)}`}
                style={{ transition: 'stroke-dashoffset 0.65s ease' }} />
              <defs>
                <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stopColor="#6366f1" />
                  <stop offset="100%" stopColor="#a855f7" />
                </linearGradient>
              </defs>
            </svg>
            <div className="absolute inset-0 flex flex-col items-center justify-center">
              <span className="text-2xl font-bold text-white">{pct}%</span>
              <Icon d={I.spark} className="w-4 h-4 text-indigo-400" />
            </div>
          </div>

          <p className="text-white font-semibold mb-1">AI is crafting your itinerary</p>
          <p className="text-slate-400 text-sm mb-6">Powered by TRAVEL-X Intelligence Engine</p>

          <div className="w-full max-w-sm space-y-2">
            {AI_STEPS.map((s, i) => {
              const done = i < cur;
              const active = i === cur;
              return (
                <div key={i} className={`flex items-center gap-3 px-4 py-2 rounded-lg transition-all ${done ? 'opacity-50' : active ? 'card' : 'opacity-25'
                  }`}>
                  {done
                    ? <div className="w-4 h-4 rounded-full bg-emerald-500 flex items-center justify-center shrink-0">
                      <Icon d={I.check} className="w-2.5 h-2.5 text-white" />
                    </div>
                    : active
                      ? <div className="spinner shrink-0" />
                      : <div className="w-4 h-4 rounded-full border border-slate-700 shrink-0" />
                  }
                  <span className={`text-xs ${active ? 'text-white font-medium' : 'text-slate-500'}`}>{s}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    /* ── Itinerary Result ───────────────────────────────────── */
    const ItineraryResult = ({ form, onRegenerate }) => {
      const [day, setDay] = useState(1);
      const d = DAYS_DATA.find(x => x.day === day);

      const typeColor = { travel: '#0ea5e9', hotel: '#a855f7', food: '#22c55e', sight: '#f59e0b' };

      return (
        <div className="fade-in">
          {/* Header */}
          <div className="flex items-center justify-between mb-5">
            <div>
              <div className="flex items-center gap-2 mb-1">
                <div className="w-7 h-7 rounded-lg bg-emerald-500/20 flex items-center justify-center">
                  <Icon d={I.check} className="w-4 h-4 text-emerald-400" />
                </div>
                <h2 className="text-white font-bold text-base">Itinerary Generated!</h2>
              </div>
              <p className="text-slate-500 text-sm">{form.destination || 'Puri, Odisha'} · 5 Days · {form.style || 'Family'} Trip</p>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={onRegenerate}
                className="flex items-center gap-1.5 text-slate-400 hover:text-white border border-line text-xs px-3 py-2 rounded-lg transition">
                <Icon d={I.refresh} className="w-3.5 h-3.5" /> Regenerate
              </button>
              <button className="flex items-center gap-1.5 text-slate-300 hover:text-white border border-line text-xs px-3 py-2 rounded-lg transition">
                <Icon d={I.share} className="w-3.5 h-3.5" /> Share
              </button>
              <button className="flex items-center gap-1.5 text-white text-xs font-semibold px-4 py-2 rounded-lg transition"
                style={{ background: 'linear-gradient(135deg,#6366f1,#818cf8)' }}>
                <Icon d={I.dl} className="w-3.5 h-3.5" /> Download PDF
              </button>
            </div>
          </div>

          {/* Summary strip */}
          <div className="grid grid-cols-4 gap-3 mb-5">
            {[
              { icon: I.map, color: '#6366f1', label: 'Destination', val: form.destination || 'Puri, Odisha' },
              { icon: I.clock, color: '#0ea5e9', label: 'Duration', val: '5 Days / 4 Nights' },
              { icon: I.report, color: '#22c55e', label: 'Total Budget', val: `₹${(form.budget || 36000).toLocaleString()}` },
              { icon: I.users, color: '#a855f7', label: 'Travel Style', val: form.style || 'Family' },
            ].map(({ icon, color, label, val }, i) => (
              <div key={i} className="card rounded-xl p-3 flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0"
                  style={{ background: color + '20', color }}>
                  <Icon d={icon} className="w-4 h-4" />
                </div>
                <div>
                  <p className="text-[10px] text-slate-500">{label}</p>
                  <p className="text-xs font-semibold text-white">{val}</p>
                </div>
              </div>
            ))}
          </div>

          {/* Day tabs */}
          <div className="flex gap-2 mb-4 overflow-x-auto pb-1">
            {DAYS_DATA.map(x => (
              <button key={x.day} onClick={() => setDay(x.day)}
                className={`shrink-0 flex flex-col items-center px-4 py-2 rounded-xl text-xs font-semibold transition-all ${day === x.day ? 'bg-indigo-600 text-white' : 'card text-slate-400 hover:bg-white/5'
                  }`}>
                <span className="text-[10px] font-normal opacity-70">Day</span>
                <span className="text-sm font-bold">{x.day}</span>
                <span className="text-[10px] opacity-70 mt-0.5">{x.date.split(' ')[0]} {x.date.split(' ')[1]}</span>
              </button>
            ))}
          </div>

          {/* Day content */}
          {d && (
            <div className="grid grid-cols-3 gap-4">
              {/* Activities */}
              <div className="col-span-2 card rounded-xl p-4">
                <div className="flex items-center justify-between mb-4">
                  <div>
                    <p className="text-white font-semibold text-sm">Day {d.day} — {d.title}</p>
                    <p className="text-slate-500 text-xs">{d.date}</p>
                  </div>
                  <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg"
                    style={{ background: d.wColor + '15', border: `1px solid ${d.wColor}30` }}>
                    <Icon d={I[d.weather.icon]} className="w-3.5 h-3.5" style={{ color: d.wColor }} />
                    <span className="text-xs font-medium" style={{ color: d.wColor }}>{d.weather.label}</span>
                  </div>
                </div>

                <div className="space-y-3">
                  {d.activities.map((act, i) => {
                    const bg = typeColor[act.type] || '#6366f1';
                    return (
                      <div key={i} className="activity-card flex items-start gap-3 p-3 rounded-xl border border-line transition-all">
                        <div className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0"
                          style={{ background: bg + '20' }}>
                          <Icon d={I[act.icon]} className="w-4 h-4" style={{ color: bg }} />
                        </div>
                        <div className="flex-1 min-w-0">
                          <div className="flex items-start justify-between gap-2">
                            <div>
                              <p className="text-white text-sm font-medium">{act.label}</p>
                              <p className="text-slate-500 text-xs mt-0.5">{act.sub}</p>
                            </div>
                            <span className="text-indigo-300 text-xs font-bold shrink-0">{act.cost}</span>
                          </div>
                          <div className="flex items-center gap-2 mt-1.5">
                            <span className="text-[10px] text-slate-500">{act.time}</span>
                            <Badge text={act.tag} color={act.tc} />
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="mt-4 flex items-center justify-between pt-3 border-t border-line">
                  <span className="text-slate-500 text-xs">Estimated Day Cost</span>
                  <span className="text-indigo-400 font-bold text-sm">{d.totalCost}</span>
                </div>
              </div>

              {/* Right panel */}
              <div className="space-y-4">
                {/* Budget */}
                <div className="card rounded-xl p-4">
                  <p className="text-white font-semibold text-sm mb-3">Budget Breakdown</p>
                  <div className="space-y-3">
                    {BUDGET.map(({ label, amount, pct, color }, i) => (
                      <div key={i}>
                        <div className="flex justify-between text-xs mb-1">
                          <span className="text-slate-400">{label}</span>
                          <span className="text-slate-300 font-medium">{amount}</span>
                        </div>
                        <div className="h-1.5 bg-panel2 rounded-full overflow-hidden">
                          <div className="h-full rounded-full progress-fill" style={{ width: pct + '%', background: color }} />
                        </div>
                        <p className="text-[10px] text-slate-600 text-right mt-0.5">{pct}%</p>
                      </div>
                    ))}
                  </div>
                  <div className="mt-3 pt-3 border-t border-line flex justify-between">
                    <span className="text-slate-400 text-xs">Total Estimate</span>
                    <span className="text-white font-bold text-sm">₹36,000</span>
                  </div>
                </div>

                {/* Tips */}
                <div className="card rounded-xl p-4">
                  <p className="text-white font-semibold text-sm mb-3 flex items-center gap-1.5">
                    <Icon d={I.star} className="w-3.5 h-3.5 text-amber-400" /> Travel Tips
                  </p>
                  <div className="space-y-2.5">
                    {[
                      { tip: 'Book Mayfair Resort early – fills fast in Dec.', color: '#f59e0b' },
                      { tip: 'Carry light rain gear for Bhubaneswar day.', color: '#0ea5e9' },
                      { tip: 'Visit Konark in the early morning for best experience.', color: '#6366f1' },
                      { tip: 'Carry small change for temple entries & ferries.', color: '#22c55e' },
                    ].map(({ tip, color }, i) => (
                      <div key={i} className="flex items-start gap-2">
                        <div className="w-1.5 h-1.5 rounded-full mt-1.5 shrink-0" style={{ background: color }} />
                        <p className="text-xs text-slate-400">{tip}</p>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Quick actions */}
                <div className="card rounded-xl p-4">
                  <p className="text-white font-semibold text-sm mb-3">Quick Actions</p>
                  <div className="space-y-2">
                    {[
                      { label: 'Save to My Trips', icon: I.heart, color: '#f43f5e' },
                      { label: 'View on Map', icon: I.map, color: '#6366f1' },
                      { label: 'Book Hotels', icon: I.hotel, color: '#a855f7' },
                      { label: 'Set Disruption Alert', icon: I.alert, color: '#f59e0b' },
                    ].map(({ label, icon, color }, i) => (
                      <button key={i}
                        className="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs text-slate-300 hover:text-white border border-line hover:border-slate-600 transition-all text-left">
                        <Icon d={icon} className="w-3.5 h-3.5 shrink-0" style={{ color }} />
                        {label}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    /* ── App ────────────────────────────────────────────────── */
    function App() {
      const [step, setStep] = useState(1);
      const [generating, setGenerating] = useState(false);
      const [done, setDone] = useState(false);
      const [form, setForm] = useState({
        destination: 'Puri, Odisha',
        startDate: '2025-12-12',
        endDate: '2025-12-16',
        interests: ['Beaches', 'Temples', 'Nature'],
        style: 'Family',
        budget: 36000,
        pace: 'Moderate',
        transport: ['Train'],
      });

      const startGen = () => { setStep(4); setGenerating(true); };
      const onDone = () => { setGenerating(false); setDone(true); };
      const onRegen = () => { setDone(false); setStep(1); };

      return (
        <div className="flex min-h-screen">
          <Sidebar />
          <main className="flex-1 ml-60 p-6 min-h-screen">
            {/* Topbar */}
            <div className="flex items-center justify-between mb-6">
              <div className="relative w-80">
                <Icon d={I.search} className="w-4 h-4 absolute left-3 top-3 text-slate-500" />
                <input placeholder="Search destinations, attractions…"
                  className="w-full rounded-lg pl-9 pr-3 py-2 text-sm" />
              </div>
              <div className="flex items-center gap-4">
                <div className="relative cursor-pointer">
                  <Icon d={I.bell} className="w-5 h-5 text-slate-400" />
                  <span className="absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center">3</span>
                </div>
                <div className="flex items-center gap-2">
                  <img className="w-8 h-8 rounded-full" src="https://i.pravatar.cc/40?img=5" alt="avatar" />
                  <span className="text-sm text-slate-300">Hello, Traveler!</span>
                </div>
                <button className="text-xs text-slate-400 hover:text-white border border-line rounded-lg px-3 py-1.5 transition">
                  Switch Role
                </button>
              </div>
            </div>

            {/* Page title */}
            <div className="flex items-center justify-between mb-6">
              <div>
                <h1 className="text-xl font-bold text-white flex items-center gap-2">
                  <span className="w-7 h-7 rounded-lg bg-indigo-600/30 flex items-center justify-center">
                    <Icon d={I.report} className="w-4 h-4 text-indigo-400" />
                  </span>
                  Itinerary Generation ✈️
                </h1>
                <p className="text-slate-500 text-sm mt-0.5">AI-powered trip planning, personalised for you.</p>
              </div>
              {done && (
                <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg"
                  style={{ background: '#22c55e10', border: '1px solid #22c55e30' }}>
                  <span className="w-2 h-2 rounded-full bg-emerald-400" style={{ animation: 'pulse 1.5s infinite' }} />
                  <span className="text-emerald-400 text-xs font-semibold">Itinerary Ready</span>
                </div>
              )}
            </div>

            {/* Main wizard card */}
            <div className="card rounded-2xl p-6" style={{ boxShadow: '0 0 0 1px #6366f120, 0 8px 40px #6366f10a' }}>
              {!done && !generating && <StepBar step={step} />}
              {step === 1 && !generating && !done && <Step1 form={form} setForm={setForm} onNext={() => setStep(2)} />}
              {step === 2 && !generating && !done && <Step2 form={form} setForm={setForm} onNext={() => setStep(3)} onBack={() => setStep(1)} />}
              {step === 3 && !generating && !done && <Step3 form={form} onNext={startGen} onBack={() => setStep(2)} />}
              {step === 4 && generating && !done && <Step4 onDone={onDone} />}
              {done && <ItineraryResult form={form} onRegenerate={onRegen} />}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
